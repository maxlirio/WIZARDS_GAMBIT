<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mage lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #202430; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; color: #eee; }
  #c { position: absolute; inset: 0; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; background: rgba(0,0,0,.45); }
  #bar button { font: inherit; padding: 3px 8px; border-radius: 4px; border: 1px solid #556; background: #2d3240; color: #eee; cursor: pointer; }
  #bar button:hover { background: #3c4356; }
  #bar b { align-self: center; margin: 0 6px 0 10px; color: #9ab; }
  #info { position: absolute; left: 8px; bottom: 6px; color: #cde; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="info"></div>
<script type="module">
// The mage on its own: two of them, one per team, on a lit floor, with every
// state a button away. ?anim=walk&view=close&t=600 triggers a state after load.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { load } from '../../js/view/assets.js';
import { makeMageActor } from '../../js/view/actors.js';

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4150);
scene.fog = new THREE.Fog(0x3a4150, 18, 40);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1, 0);

// The arena's light rig, near enough.
const sun = new THREE.DirectionalLight(0xffe3bd, 3.2);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
sun.shadow.camera.right = sun.shadow.camera.top = 8;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9fb8e8, 0x4a4030, 0.75));
scene.add(new THREE.AmbientLight(0x60584a, 0.25));

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshStandardMaterial({ color: 0x6d7a5a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(12, 12, 0x3a4332, 0x4c5842);
grid.position.y = 0.002;
scene.add(grid);
// A metre stick: 2 m tall, ticks every 0.5 m, so height can be read off a shot.
const stick = new THREE.Group();
for (let i = 0; i <= 4; i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.012, 0.012), new THREE.MeshBasicMaterial({ color: i === 4 ? 0xff4040 : 0xffffff })); t.position.y = i * 0.5; stick.add(t); }
stick.add(new THREE.Mesh(new THREE.BoxGeometry(0.012, 2, 0.012), new THREE.MeshBasicMaterial({ color: 0xffffff })).translateY(1));
stick.position.set(0, 0, -0.3);
scene.add(stick);

const VIEWS = {
  close: [[0, 1.3, 3.3], [0, 0.95, 0]],
  face: [[-0.85, 1.32, 1.25], [-0.85, 1.28, 0]],
  face1: [[0.85, 1.32, 1.25], [0.85, 1.28, 0]],
  staff: [[-0.3, 1.4, 1.6], [-0.75, 1.15, 0]],
  side: [[5.2, 1.2, 0.4], [0, 0.95, 0]],
  jump: [[0, 2.4, 6.0], [0, 1.6, 0]],
  back: [[0, 1.3, -3.3], [0, 0.95, 0]],
  low: [[2.8, 1.0, 3.2], [0, 0.35, 0]],
  far: [[0, 4.5, 11], [0, 0.9, 0]],
};
function view(name) {
  const v = VIEWS[name] || VIEWS.close;
  camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update();
}

const mages = [];
const gltf = await load('mage');
const TEAM = [0x4fd2ff, 0xff5d5d], DARK = [0x1d4e78, 0x6a1a1a];
for (let p = 0; p < 2; p++) {
  const m = makeMageActor(gltf, { team: TEAM[p], teamDark: DARK[p] });
  m.root.position.set(p ? 0.85 : -0.85, 0, 0);
  m.home = m.root.position.x;
  scene.add(m.root);
  mages.push(m);
}

// Every state the arena can ask for. Walk/run move the root along the facing
// so sliding and the forward axis are visible.
const face = () => { for (const m of mages) m.facingTarget = 0; };
const STATES = {
  idle() { for (const m of mages) { m.moving = false; m.facingTarget = 0; } },
  fidget() { for (const m of mages) { m.moving = false; m.facingTarget = 0; m.oneShot('fidget', { speed: 0.85, fade: 0.45 }); } },
  walk() { for (const m of mages) { m.moving = true; m.speed = 2.6; m.facingTarget = Math.PI / 2; } },
  run() { for (const m of mages) { m.moving = true; m.speed = 4.4; m.facingTarget = Math.PI / 2; } },
  shoot() { face(); for (const m of mages) { m.moving = false; m.cast('shoot'); } },
  raise() { face(); for (const m of mages) { m.moving = false; m.cast('raise'); } },
  long() { face(); for (const m of mages) { m.moving = false; m.cast('long'); } },
  summon() { face(); for (const m of mages) { m.moving = false; m.summon(); } },
  hit() { face(); for (const m of mages) { m.moving = false; m.hit(); } },
  hit2() { face(); for (const m of mages) { m.moving = false; m.hit(); m.hit(); } },
  strike() { face(); for (const m of mages) { m.moving = false; m.strike(); } },
  jump() { face(); for (const m of mages) { m.moving = false; m.jump(0.95); m.airT = 0; } },
  cheer() { face(); for (const m of mages) { m.moving = false; m.cheer(); } },
  die() { face(); for (const m of mages) { m.die(); } },
  revive() { face(); for (const m of mages) { m.revive(); } },
  turn() { for (const m of mages) { m.moving = false; m.facingTarget = Math.PI; } },
};
const bar = document.getElementById('bar');
const add = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); };
const sep = (t) => { const b = document.createElement('b'); b.textContent = t; bar.appendChild(b); };
sep('state'); for (const k of Object.keys(STATES)) add(k, () => trigger(k));
sep('view'); for (const k of Object.keys(VIEWS)) add(k, () => view(k));

function trigger(name) { STATES[name]?.(); return name; }

// The thrown arc the arena would drive: 0.95 s sine hop, 1.6 m high.
function measure() {
  const m = mages[0];
  const box = new THREE.Box3().setFromObject(m.model, true);
  const orb = m.handPoint();
  // Forward check: the cape should hang behind the mage (-Z when facing +Z).
  let cape = null; m.model.traverse((o) => { if (o.name === 'Mage_Cape') cape = o; });
  const cp = cape ? cape.getWorldPosition(new THREE.Vector3()) : null;
  return { top: +box.max.y.toFixed(3), bottom: +box.min.y.toFixed(3), orb: orb.toArray().map((v) => +v.toFixed(3)), capeZ: cp ? +(cp.z - m.root.position.z).toFixed(3) : null, facing: +m.facing.toFixed(3) };
}

const info = document.getElementById('info');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const m of mages) {
    if (m.moving) {
      m.root.position.x += Math.sin(m.facing) * m.speed * dt;
      m.root.position.z += Math.cos(m.facing) * m.speed * dt;
      if (m.root.position.x > m.home + 1.6) m.root.position.x = m.home - 1.6;
    } else if (!m.dead && Math.abs(m.root.position.x - m.home) > 0.01) {
      m.root.position.x += (m.home - m.root.position.x) * Math.min(1, dt * 4);
    }
    if (m.airT !== undefined && m.airT !== null) {
      m.airT += dt;
      const k = Math.min(1, m.airT / 0.95);
      m.airY = Math.sin(k * Math.PI) * 1.6;
      m.root.position.y = m.airY;
      if (k >= 1) { m.airT = null; m.airY = 0; m.root.position.y = 0; }
    }
    m.update(dt, now);
  }
  controls.update();
  const w = innerWidth, h = innerHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  renderer.render(scene, camera);
  const mm = measure();
  info.textContent = `top ${mm.top} m   orb ${mm.orb.join(', ')}   capeZ ${mm.capeZ}   facing ${mm.facing}`;
  requestAnimationFrame(frame);
}
view(params.get('view') || 'close');
requestAnimationFrame(frame);
if (params.get('anim')) setTimeout(() => trigger(params.get('anim')), +(params.get('t') || 300));

window.LAB = { scene, camera, controls, renderer, mages, trigger, view, measure, ready: true };
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mage lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #202430; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; color: #eee; }
  #c { position: absolute; inset: 0; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; background: rgba(0,0,0,.45); }
  #bar button { font: inherit; padding: 3px 8px; border-radius: 4px; border: 1px solid #556; background: #2d3240; color: #eee; cursor: pointer; }
  #bar button:hover { background: #3c4356; }
  #bar b { align-self: center; margin: 0 6px 0 10px; color: #9ab; }
  #info { position: absolute; left: 8px; bottom: 6px; color: #cde; white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="info"></div>
<script type="module">
// The code-built mage on its own: two of them, one per team, on a lit floor,
// with every state a button away. ?anim=walk&view=close&t=600 triggers a
// state after load; view is close|front|side|back|face|staff|low|far|jump;
// ?solo=1 puts one mage at the origin. `death` and `respawn` run the arena's
// full rites (fall, dust on the wind; magic gathers, the body forms).
//
// ?manual=1 stops the clock: nothing advances until LAB.advance(seconds) is
// called, which steps the whole lab at a fixed 60 Hz on a virtual clock, so a
// frame strip (LAB.strip / LAB.grab / LAB.stripPNG) is exact and repeatable.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeMageActor, mageClipList } from '../../js/view/mage.js';
import { createFx } from '../../js/view/fx.js';
import { createMageRites } from '../../js/view/mage-rites.js';

const params = new URLSearchParams(location.search);
const manual = params.get('manual') === '1';
// The virtual clock: everything in the lab (and the mage's own step timing)
// reads performance.now(), so in manual mode that IS the stepped clock.
let vnow = 0;
if (manual) performance.now = () => vnow;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4150);
scene.fog = new THREE.Fog(0x3a4150, 18, 40);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1, 0);

// The arena's light rig, near enough.
const sun = new THREE.DirectionalLight(0xffe3bd, 3.2);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
sun.shadow.camera.right = sun.shadow.camera.top = 8;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9fb8e8, 0x4a4030, 0.75));
scene.add(new THREE.AmbientLight(0x60584a, 0.25));

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), new THREE.MeshStandardMaterial({ color: 0x6d7a5a, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(12, 12, 0x3a4332, 0x4c5842);
grid.position.y = 0.002;
scene.add(grid);
// A metre stick: 2 m tall, ticks every 0.5 m, so height can be read off a shot.
const stick = new THREE.Group();
for (let i = 0; i <= 4; i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.012, 0.012), new THREE.MeshBasicMaterial({ color: i === 4 ? 0xff4040 : 0xffffff })); t.position.y = i * 0.5; stick.add(t); }
stick.add(new THREE.Mesh(new THREE.BoxGeometry(0.012, 2, 0.012), new THREE.MeshBasicMaterial({ color: 0xffffff })).translateY(1));
stick.position.set(0, 0, -0.3);
scene.add(stick);

const VIEWS = {
  close: [[0, 1.3, 3.3], [0, 0.95, 0]],
  front: [[0, 1.3, 3.3], [0, 0.95, 0]],
  face: [[-0.85, 1.62, 1.0], [-0.85, 1.55, 0]],
  face1: [[0.85, 1.62, 1.0], [0.85, 1.55, 0]],
  face0: [[0.2, 1.72, 0.85], [0, 1.6, 0]],
  staff: [[-0.3, 1.5, 1.6], [-0.95, 1.25, 0]],
  side: [[5.2, 1.2, 0.4], [0, 0.95, 0]],
  sideclose: [[3.4, 1.1, 0.3], [0, 0.95, 0]],
  jump: [[0, 2.4, 6.0], [0, 1.6, 0]],
  back: [[0, 1.3, -3.3], [0, 0.95, 0]],
  low: [[2.8, 1.0, 3.2], [0, 0.35, 0]],
  far: [[0, 4.5, 11], [0, 0.9, 0]],
  quarter: [[2.4, 1.5, 2.6], [0, 0.95, 0]],
  strip: [[3.6, 1.3, 2.4], [0, 0.85, 0]],     // three-quarter, whole body with room to fall and roll
  stripfront: [[4.0, 1.3, 0.6], [0, 0.85, 0]],      // ahead of a walker (it walks along +X)
  stripside: [[0.3, 1.1, 4.4], [0, 0.8, 0]],        // beside a walker
  striphigh: [[4.6, 2.4, 3.1], [0, 1.2, 0]],        // room above for a drop
  stripair: [[0.3, 2.0, 5.6], [0, 1.3, 0]],
  hd: [[1.9, 1.45, 2.6], [0, 1.0, 0]],
};
let viewNow = VIEWS.close;
function view(name) {
  const v = viewNow = VIEWS[name] || VIEWS.close;
  camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update();
}
// With LAB.follow on (strips), the camera keeps its offset from the first mage's root, so a walk stays in frame.
function follow() {
  const r = mages[0].root.position, v = viewNow;
  camera.position.set(r.x + v[0][0], v[0][1], r.z + v[0][2]); controls.target.set(r.x + v[1][0], v[1][1], r.z + v[1][2]);
}

const fx = createFx(scene, { quality: 'high' });
const rites = createMageRites(fx);
const mages = [];
const TEAM = [0x4fd2ff, 0xff5d5d], DARK = [0x1d4e78, 0x6a1a1a];
const solo = params.get('solo') === '1';
for (let p = 0; p < (solo ? 1 : 2); p++) {
  const m = makeMageActor({ team: TEAM[p], teamDark: DARK[p] });
  m.team = TEAM[p];
  m.root.position.set(solo ? 0 : p ? 0.85 : -0.85, 0, 0);
  m.home = m.root.position.x;
  m.fidgets = params.get('fidgets') === '1';   // random idle fidgets off by default: shots must be repeatable
  scene.add(m.root);
  mages.push(m);
}

// Every state the arena can ask for. Walk/run move the root along the facing
// so sliding and the forward axis are visible. `still` stops the mage first;
// the `*-moving` states do NOT, so overlays on top of locomotion can be seen.
const face = () => { for (const m of mages) m.facingTarget = 0; };
const still = (fn) => { face(); for (const m of mages) { m.moving = false; m.levitate(false); fn(m); } };
const go = (speed, dir = Math.PI / 2) => { for (const m of mages) { m.levitate(false); m.moving = true; m.speed = speed; m.facingTarget = dir; } };
const STATES = {
  idle() { still(() => {}); },
  stop() { for (const m of mages) m.moving = false; },
  fidget() { still((m) => m.oneShot('fidget', { speed: 0.85, fade: 0.45 })); },
  walk() { go(2.6); },
  run() { go(4.4); },
  walkback() { go(2.6, -Math.PI / 2); },
  turn() { for (const m of mages) { m.moving = false; m.facingTarget = Math.PI; } },
  turnwalk() { for (const m of mages) { m.facingTarget = -Math.PI / 2; } },
  shoot() { still((m) => m.cast('shoot')); },
  raise() { still((m) => m.cast('raise')); },
  long() { still((m) => m.cast('long')); },
  summon() { still((m) => m.summon()); },
  hit() { still((m) => m.hit('blow')); },
  hit2() { still((m) => { m.hit('blow'); m.hit('blow'); }); },
  fire() { still((m) => m.hit('fire')); },
  lightning() { still((m) => m.hit('lightning')); },
  crush() { still((m) => m.hit('crush')); },
  shove() { still((m) => m.shove()); },
  strike() { still((m) => m.strike()); },
  // Overlays: the same, without stopping (walk/run first).
  shootmoving() { for (const m of mages) m.cast('shoot'); },
  hitmoving() { for (const m of mages) m.hit('blow'); },
  firemoving() { for (const m of mages) m.hit('fire'); },
  knockdown() { still((m) => m.knockdown(Math.PI)); },        // thrown backwards: straight down on the back
  knockdownF() { still((m) => m.knockdown(0)); },             // thrown forwards: on the face
  knockdownL() { still((m) => m.knockdown(Math.PI / 2)); },   // thrown to its left: turns, down on the back
  knockmoving() { for (const m of mages) { m.moving = false; m.knockdown(Math.PI); } },
  jump() { still((m) => { m.jump(0.95); m.airT = 0; m.airKind = 'jump'; }); },
  tumble() { still((m) => { m.tumble(0.8); m.airT = 0; m.airKind = 'fall'; }); },
  // A deliberate drop: the lab lets the root fall 1.6 m over 0.8 s (the arena's job); land* must be called.
  drop() { for (const m of mages) { m.drop(); m.airT = 0; m.airKind = 'drop'; } },
  landsoft() { for (const m of mages) { m.land(false); m.airT = null; m.airY = 0; m.root.position.y = 0; } },
  landhard() { for (const m of mages) { m.land(true); m.airT = null; m.airY = 0; m.root.position.y = 0; } },
  burn() { still((m) => m.burnOff()); },
  levitate() { still((m) => m.levitate(true)); },
  cheer() { still((m) => m.cheer()); },
  die() { face(); for (const m of mages) m.die(); },
  revive() { face(); for (const m of mages) m.revive(); },
  // The arena's rites: fall, lie still, blow away as dust (then hidden);
  // magic gathers on the spot, the body forms and gets up.
  death() { face(); for (const m of mages) { m.moving = false; m.levitate(false); m.die(); m.deathT = 0; } },
  respawn() {
    face();
    for (const m of mages) {
      if (!m.dead) m.die();
      m.deathT = null; m.setHidden(true);
      m.root.position.set(m.home, 0, 0);
      rites.gather(m.home, 0, 0, m.team, { onAppear: () => rites.materialise(m, m.team) });
    }
  },
  fidgets() { for (const m of mages) m.fidgets = !m.fidgets; },
};
const bar = document.getElementById('bar');
const add = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); };
const sep = (t) => { const b = document.createElement('b'); b.textContent = t; bar.appendChild(b); };
sep('state'); for (const k of Object.keys(STATES)) add(k, () => trigger(k));
sep('view'); for (const k of Object.keys(VIEWS)) add(k, () => view(k));

function trigger(name) { STATES[name]?.(); return name; }

const box = new THREE.Box3();
const _p = new THREE.Vector3();
const boneY = (m, name) => m.skeleton.bones.find((b) => b.name === name).getWorldPosition(_p).y - m.root.position.y;
function measure() {
  const m = mages[0];
  box.setFromObject(m.model, true);
  const orb = m.handPoint();
  // Forward check: the cape should hang behind the mage (-Z when facing +Z).
  const cp = m.skeleton.bones.find((b) => b.name === 'cape4').getWorldPosition(new THREE.Vector3());
  // The lowest of the four foot bones, relative to the root: a foot through the floor reads negative.
  const toeY = Math.min(boneY(m, 'toeL'), boneY(m, 'toeR'), boneY(m, 'ftL') - 0.045, boneY(m, 'ftR') - 0.045);
  return { top: +box.max.y.toFixed(3), bottom: +box.min.y.toFixed(3), orb: orb.toArray().map((v) => +v.toFixed(3)), capeZ: +(cp.z - m.root.position.z).toFixed(3), toeY: +toeY.toFixed(3), facing: +m.facing.toFixed(3), tris: renderer.info.render.triangles, calls: renderer.info.render.calls, height: m.height, ...m.state };
}

const info = document.getElementById('info');
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fx.update(dt, now);
  for (const m of mages) {
    if (m.deathT !== null && m.deathT !== undefined) {
      m.deathT += dt;
      if (rites.deathStep(m, m.deathT, dt)) { m.deathT = null; m.setHidden(true); }
    }
    if (m.moving) {
      m.root.position.x += Math.sin(m.facing) * m.speed * dt;
      m.root.position.z += Math.cos(m.facing) * m.speed * dt;
      if (m.root.position.x > m.home + 1.6) m.root.position.x = m.home - 1.6;
      if (m.root.position.x < m.home - 1.6) m.root.position.x = m.home + 1.6;
    } else if (!m.dead && Math.abs(m.root.position.x - m.home) > 0.01 && (m.airT === undefined || m.airT === null)) {
      m.root.position.x += (m.home - m.root.position.x) * Math.min(1, dt * 4);
    }
    if (m.airT !== undefined && m.airT !== null) {
      m.airT += dt;
      if (m.airKind === 'jump') {
        // The thrown arc the arena would drive: 0.95 s sine hop, 1.6 m high.
        const k = Math.min(1, m.airT / 0.95);
        m.airY = Math.sin(k * Math.PI) * 1.6;
        if (k >= 1) { m.airT = null; m.airY = 0; }
      } else {
        // Off a ledge: start 1.6 m up, fall with gravity for 0.8 s.
        const k = Math.min(1, m.airT / 0.8);
        m.airY = 1.6 * (1 - k * k);
        if (k >= 1) { m.airT = null; m.airY = 0; }
      }
      m.root.position.y = m.airY;
    }
    m.update(dt, now);
  }
  if (window.LAB && LAB.follow) follow();
  controls.update();
  const w = innerWidth, h = innerHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  renderer.render(scene, camera);
  const mm = measure();
  info.textContent = `top ${mm.top} m   orb ${mm.orb.join(', ')}   capeZ ${mm.capeZ}   toeY ${mm.toeY}   facing ${mm.facing}   tris ${mm.tris}  calls ${mm.calls}   ${mm.step}${mm.overlay ? '+' + mm.overlay : ''} spd ${mm.spd} w ${mm.locoW}`;
  if (!manual) requestAnimationFrame(frame);
}
view(params.get('view') || 'close');

/* Frame strips: a 2D canvas the shooter fills cell by cell, then reads as PNG. */
const stripC = document.createElement('canvas');
let stripCols = 1, stripCW = 320, stripCH = 240, stripN = 0;
function strip(cols, rows, cw, ch) {
  stripCols = cols; stripCW = cw; stripCH = ch; stripN = 0;
  stripC.width = cols * cw; stripC.height = rows * ch;
  const g = stripC.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, stripC.width, stripC.height);
}
function grab(label) {
  const g = stripC.getContext('2d');
  const x = (stripN % stripCols) * stripCW, y = Math.floor(stripN / stripCols) * stripCH;
  g.drawImage(canvas, 0, 0, canvas.width, canvas.height, x, y, stripCW, stripCH);
  g.strokeStyle = '#000'; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, stripCW - 1, stripCH - 1);
  g.font = 'bold 13px ui-monospace, monospace'; g.fillStyle = '#000'; g.fillText(label, x + 7, y + 17); g.fillStyle = '#ffe680'; g.fillText(label, x + 6, y + 16);
  stripN++;
}
const stripPNG = () => stripC.toDataURL('image/png');
/** Manual mode: step the lab `sec` seconds at `fps`. */
function advance(sec, fps = 60) {
  const n = Math.max(1, Math.round(sec * fps));
  for (let i = 0; i < n; i++) { vnow += 1000 / fps; frame(vnow); }
}

if (manual) { vnow = 1000; last = vnow; advance(0.5); }
else requestAnimationFrame(frame);
if (params.get('anim')) setTimeout(() => trigger(params.get('anim')), +(params.get('t') || 300));

window.LAB = { follow: false, scene, camera, controls, renderer, mages, fx, rites, trigger, view, measure, clips: mageClipList(), strip, grab, stripPNG, advance, manual, ready: true };
</script>
</body>
</html>

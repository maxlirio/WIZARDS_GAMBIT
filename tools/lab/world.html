<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>world lab</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px/1.4 monospace;background:rgba(0,0,0,.5);padding:6px 8px;pointer-events:none;white-space:pre}</style>
<script type="importmap">
{ "imports": {
  "three": "../../vendor/three/three.module.js",
  "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
// A lab for js/view/world.js alone: a fake arena, the world built on it, the
// game's renderer settings (ACES 0.95, bloom 0.38/0.55/0.88, soft shadows), and
// a handful of named camera views. ?seed=N&view=home|wide|low|corner|tree|ward|stone|sky&q=high|medium|low
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { makeArena } from '../../js/field/arena.js';
import { loadAll } from '../../js/view/assets.js';
import { buildWorld } from '../../js/view/world.js';

const P = new URLSearchParams(location.search);
const seed = +(P.get('seed') || 7);
const quality = P.get('q') || 'high';
const arena = makeArena(seed);
const MM = 1 / 1000;
const W = arena.w * MM, H = arena.h * MM;

const renderer = new THREE.WebGLRenderer({ antialias: quality !== 'high', preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(quality === 'low' ? 1 : 2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa6c4);
const camera = new THREE.PerspectiveCamera(40, 1, 0.2, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const gh = (x, z) => (window.LAB?.world ? LAB.world.heightAt(x, z) : 0);
const VIEWS = {
  home: () => [[-4.2, 8.2, H / 2 + 0.01], [W / 2 + 0.2, 0.3, H / 2]],
  wide: () => [[-18, 16, H / 2 + 6], [W / 2, 0.5, H / 2]],
  low: () => [[W * 0.3, gh(W * 0.3, H * 0.4) + 1.1, H * 0.4 - 2.4], [W * 0.3 + 0.6, gh(W * 0.3 + 0.6, H * 0.4) + 0.2, H * 0.4]],
  corner: () => [[-3.5, gh(-3.5, -3.5) + 2.2, -3.5], [-0.6, gh(-0.9, -0.9) + 0.9, -0.6]],
  stone: () => [[-2.6, gh(-2.6, H / 2 + 2.4) + 1.6, H / 2 + 2.4], [-0.9, gh(-0.9, H / 2) + 1.0, H / 2]],
  ward: () => [[W / 2 - 1.5, gh(W / 2 - 1.5, -1.6) + 1.2, -1.6], [W / 2 + 0.5, gh(W / 2 + 0.5, 0) + 0.1, 0.2]],
  tree: () => { const t = LAB.world.forest.userData.nearest || { x: W / 2, z: -8 }; return [[t.x + 4, gh(t.x + 4, t.z + 3) + 2.2, t.z + 3], [t.x, gh(t.x, t.z) + 2.0, t.z]]; },
  sky: () => [[W / 2, 2.5, H + 6], [W / 2, 9, -30]],
  far: () => [[W / 2 + 1, 4.5, H + 14], [W / 2, 2.5, -40]],
  top: () => [[W / 2, 28, H / 2 + 0.01], [W / 2, 0, H / 2]],
  up: () => [[W / 2, 1.6, H + 4], [W / 2, 22, -30]],
  ruins: () => { const a = LAB.world.ruins.userData.at; return [[a.x + (W / 2 - a.x) * 0.45, gh(a.x + (W / 2 - a.x) * 0.45, a.z + (H / 2 - a.z) * 0.45) + 3, a.z + (H / 2 - a.z) * 0.45], [a.x, a.y + 1.5, a.z]]; },
};
function view(name) {
  const v = (VIEWS[name] || VIEWS.home)();
  camera.position.set(...v[0]);
  controls.target.set(...v[1]);
  controls.update();
  window.LAB.viewName = name;
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.fov = 40; camera.updateProjectionMatrix();
  composer?.setSize(w, h);
}
let composer = null;
if (quality !== 'low') {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.38, 0.55, 0.88));
  composer.addPass(new OutputPass());
}
window.LAB = { ready: false, scene, renderer, camera, controls, view, world: null, arena, frames: 0, info: () => ({ tris: renderer.info.render.triangles, calls: renderer.info.render.calls }) };
addEventListener('resize', resize);
resize();

const gltfs = await loadAll();
const world = buildWorld(scene, renderer, arena, seed, gltfs, { quality });
LAB.world = world;
// Nearest tree to the ward, for the close-up.
let best = null;
world.forest.traverse((o) => {
  if (!o.isInstancedMesh || o.userData.kind !== 'tree') return;
  const m = new THREE.Matrix4(), p = new THREE.Vector3();
  for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, m); p.setFromMatrixPosition(m); const d = world.L.outside(p.x, p.z); if (d > 1 && (!best || d < best.d)) best = { x: p.x, z: p.z, d }; }
});
world.forest.userData.nearest = best;
view(P.get('view') || 'home');
LAB.ready = true;

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  renderer.info.reset();
  world.update(dt, now);
  controls.update();
  if (composer) composer.render(); else renderer.render(scene, camera);
  LAB.frames++;
  if (LAB.frames % 15 === 0) {
    const i = renderer.info.render;
    document.getElementById('hud').textContent = `seed ${seed} q ${quality} view ${LAB.viewName}\ntris ${i.triangles} calls ${i.calls}\ncam ${camera.position.toArray().map((v) => v.toFixed(1)).join(',')} -> ${controls.target.toArray().map((v) => v.toFixed(1)).join(',')}`;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>

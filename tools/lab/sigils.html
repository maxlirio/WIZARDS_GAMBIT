<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sigils lab</title>
<!-- The runes column and the Spellbook of sigils at arm's length, with the
     HUD's own stylesheet: an empty pouch and board at the start of a duel; a
     pouch with runes, the board half laid with a chip picked; a bind frozen
     mid-flash on the cells it hit; the enemy's small pouch; then the
     Spellbook with a few known entries among the unknown. The markup mirrors
     buildSigils/renderSigils/sigilMiniHTML in js/view/main.js, which cannot
     be imported without booting the game. window.LAB.ready when drawn. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { overflow: auto; height: auto; }
  body { margin: 0; background: #1a1612; display: flex; gap: 18px; padding: 16px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .boards { display: flex; gap: 14px; align-items: flex-start; }
  .boards .sigils { padding: 10px 12px; width: calc(var(--sig-w) + 24px); }
  .boards .sigils.small { width: auto; }
  .lbl { font: 11px ui-monospace, monospace; color: #9fd8ff; }
  .mbox { width: 640px; max-height: none; }
</style>
</head>
<body>
<script type="module">
import { runeGlyphInline, SCHOOL_INK } from '../../js/view/cards.js';
import { CARDS } from '../../js/rules/spells/index.js';
import { spellbookPage } from '../../js/rules/learn.js';
import { BOARD_W, BOARD_CELLS } from '../../js/rules/sigils.js';
import { RUNES } from '../../js/rules/runes.js';

const RUNE_INK = { SPIRAL: '#c98bff', SHARD: '#ff6a52', WHEEL: '#52b6ff', LATTICE: '#5ee68f' };
const RUNE_NAME = { SPIRAL: 'Spiral', SHARD: 'Shard', WHEEL: 'Wheel', LATTICE: 'Lattice' };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/**
 * A runes column as the HUD draws it. `pouch` is the player's pouch counts,
 * `cells` the scratch board (rune|null x 16). `opts`: picked (a rune), flash
 * (cells mid-bind), hint, bind (the button enabled), small (the enemy's).
 */
function column(pouch, cells, opts = {}) {
  const host = document.createElement('div');
  host.className = `sigils panel${opts.small ? ' small' : ''}`;
  host.innerHTML = `<div class="sighead">Runes</div>
    <div class="sigpouch">${RUNES.map((r) => `<button type="button" class="chip" data-r="${r}" title="${RUNE_NAME[r]}">${runeGlyphInline(r, RUNE_INK[r])}<b>0</b></button>`).join('')}</div>
    <div class="sigboard">${Array.from({ length: BOARD_CELLS }, (_, i) => `<div class="sigcell" data-idx="${i}"></div>`).join('')}</div>
    <div class="sigbtns"><button type="button" class="primary" ${opts.bind ? '' : 'disabled'}>Bind</button><button type="button" class="ghost clear" ${cells.some(Boolean) ? '' : 'disabled'}>Clear</button></div>
    <div class="sighint"></div>`;
  const laid = {};
  for (const r of RUNES) laid[r] = cells.filter((x) => x === r).length;
  host.querySelectorAll('.chip').forEach((el) => {
    const r = el.dataset.r;
    const n = opts.small ? pouch[r] : Math.max(0, pouch[r] - laid[r]);
    el.querySelector('b').textContent = n;
    el.classList.toggle('picked', opts.picked === r);
    el.classList.toggle('empty', n <= 0);
    el.disabled = !!opts.small || n <= 0;
  });
  host.querySelectorAll('.sigcell').forEach((el, i) => {
    const r = cells[i];
    el.innerHTML = r ? runeGlyphInline(r, RUNE_INK[r]) : '';
    el.classList.toggle('set', !!r);
    el.classList.toggle('open', !r && !!opts.picked);
    if (opts.flash?.includes(i)) { el.classList.add('flash-sigil'); el.style.animation = 'flashSigil 1s ease-out -0.12s paused'; }
  });
  host.querySelector('.sighint').textContent = opts.hint || '';
  return host;
}

function sigilMiniHTML(cells, ink) {
  const w = Math.max(...cells.map((c) => c.x)) + 1, h = Math.max(...cells.map((c) => c.y)) + 1;
  const at = new Map(cells.map((c) => [`${c.x},${c.y}`, c.r]));
  let out = `<div class="sgrid" style="grid-template-columns:repeat(${w},15px)">`;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const r = at.get(`${x},${y}`);
    out += r ? `<i>${runeGlyphInline(r, ink)}</i>` : '<i class="e"></i>';
  }
  return out + '</div>';
}

await document.fonts.ready;
const q = new URLSearchParams(location.search);
const idx = (x, y) => y * BOARD_W + x;

const empty = { SPIRAL: 0, SHARD: 0, WHEEL: 0, LATTICE: 0 };
const pouch = { SPIRAL: 2, SHARD: 3, WHEEL: 1, LATTICE: 4 };
// Half laid: a Spiral over two Shards down the second column (Firebrand's
// shape in the printed deck), a Lattice pair along the bottom; the Shard chip
// is picked with one Shard still free.
const half = Array(BOARD_CELLS).fill(null);
half[idx(1, 0)] = 'SPIRAL'; half[idx(1, 1)] = 'SHARD'; half[idx(1, 2)] = 'SHARD';
half[idx(0, 3)] = 'LATTICE'; half[idx(1, 3)] = 'LATTICE'; half[idx(3, 0)] = 'WHEEL';
const hits = [idx(1, 0), idx(1, 1), idx(1, 2)];

const col = document.createElement('div'); col.className = 'col';
const row = document.createElement('div'); row.className = 'boards';
row.append(
  column(empty, Array(BOARD_CELLS).fill(null), { hint: 'No runes yet — resolving faces earns them' }),
  column(pouch, half, { picked: 'SHARD', bind: true, hint: 'Lay runes from your pouch, then Bind — once a turn' }),
  column(pouch, half, { flash: hits, hint: 'Bound this turn' }),
  column({ SPIRAL: 1, SHARD: 0, WHEEL: 3, LATTICE: 2 }, Array(BOARD_CELLS).fill(null), { small: true }),
);
col.appendChild(row);
const lbl = document.createElement('div'); lbl.className = 'lbl';
lbl.textContent = 'empty pouch · half laid, Shard picked, Bind live · bound, the hit cells mid-flash · the enemy\'s pouch';
col.appendChild(lbl);
document.body.appendChild(col);

// The Spellbook: the first few findable cards known, the rest a hint.
const learned = {};
for (const id of (q.get('known') || 'FIREBRAND,CINDER_RAIN,BLOOD_PACT,VENOM_DART,HAMMER_FALL').split(',')) if (CARDS[id]) learned[id] = 'sigil';
const page = spellbookPage(Object.values(CARDS), learned);
const known = page.filter((x) => x.known).length;
const runeList = (x) => x.runes.map((r) => RUNE_NAME[r]).join(', ');
const book = document.createElement('div'); book.className = 'mbox';
book.innerHTML = `<h2>The Spellbook</h2>
  <p class="dim">Spells are <b>found</b>, not earned. Every face you resolve earns a rune of its kind of work — Spiral for turning, Shard for breaking, Wheel for moving, Lattice for drawing — into your pouch. Once a turn, lay runes on your board and <b>Bind</b>: any card whose <b>sigil</b> you have laid, in any of its four turns, is found and its runes are spent; the rest go back to your pouch. The Spellbook remembers every shape you have made; for the rest it knows only which runes they take.</p>
  <p><b>${known}</b> of ${page.length} sigils known · 12 duels · 7 won</p>
  <div class="book sig">${page.slice(0, +(q.get('n') || 24)).map((x) => {
    if (!x.known) return `<div class="bk sg unknown"><span class="q">?</span><div><span class="bc">undiscovered</span><span class="bh">${x.size} runes: ${esc(runeList(x))}</span></div></div>`;
    const d = CARDS[x.id];
    const ink = SCHOOL_INK[d?.kind === 'golem' ? 'golem' : d?.school] || '#ccc';
    return `<div class="bk sg"><span class="sgbox">${sigilMiniHTML(x.sigil, ink)}</span><div><span class="bc" style="color:${ink}">${esc(x.name)}</span><span class="bh">${x.size} runes · ${d?.kind === 'golem' ? `golem, tier ${d.tier}` : d?.kind === 'artifact' ? 'artifact' : d?.kind === 'trap' ? 'trap' : `${d?.school} spell`}</span></div></div>`;
  }).join('')}</div>
  <div class="mbtns"><button class="primary">Close</button></div>`;
document.body.appendChild(book);
window.LAB = { ready: true, hits, known };
</script>
</body>
</html>

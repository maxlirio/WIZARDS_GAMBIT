<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 12px/1.4 ui-monospace, monospace; color: #ddd; }
  #hud { position: fixed; left: 10px; top: 8px; z-index: 2; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #ffd27a; }
  #bar { position: fixed; left: 10px; bottom: 8px; z-index: 2; display: flex; gap: 4px; flex-wrap: wrap; }
  #bar a { color: #9fd8ff; background: #0008; padding: 2px 6px; border-radius: 3px; text-decoration: none; }
  #bar a.on { background: #ffd27a; color: #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../vendor/three/three.module.js",
  "three/addons/": "../../vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="hud"><b id="name">-</b> <span id="info"></span></div>
<div id="bar"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createFx } from '../../js/view/fx.js';

const Q = new URLSearchParams(location.search);
const NAMES = ['burn', 'explosion', 'lightning', 'sigil', 'bolt', 'dust', 'debris', 'motes', 'ring', 'quake', 'beam', 'burst'];
const which = Q.get('fx') || 'explosion';
const period = Q.has('period') ? +Q.get('period') : 1500;
const quality = Q.get('q') || 'high';

/* ---- renderer like the game */
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa6c4);
scene.fog = new THREE.Fog(0xc9b9a4, 35, 110);
const camera = new THREE.PerspectiveCamera(44, 1, 0.2, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* ---- lights like world.js */
const sunDir = new THREE.Vector3(-0.55, 0.32, -0.62).normalize();
const sun = new THREE.DirectionalLight(0xffe3bd, 3.2);
sun.position.copy(sunDir).multiplyScalar(60);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 10, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 2;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x9fb8e8, 0x4a4030, 0.75));
scene.add(new THREE.AmbientLight(0x60584a, 0.25));

/* ---- a lit ground, a dark "tree", a rock to levitate, a crate to break */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60, 1, 1), new THREE.MeshStandardMaterial({ color: 0x6b7a48, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(40, 40, 0x556644, 0x556644); grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.25; scene.add(grid);
const TREE = new THREE.Vector3(-2.4, 0, -1.6);
const tree = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.42, 3, 10), new THREE.MeshStandardMaterial({ color: 0x2a1d12, roughness: 0.9 }));
tree.position.set(TREE.x, 1.5, TREE.z); tree.castShadow = tree.receiveShadow = true; scene.add(tree);
const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 1), new THREE.MeshStandardMaterial({ color: 0x2f4a1e, roughness: 0.95, flatShading: true }));
crown.position.set(TREE.x, 2.9, TREE.z); crown.castShadow = true; scene.add(crown);
const ROCK = new THREE.Vector3(2.6, 1.4, 1.4);
const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.55, 0), new THREE.MeshStandardMaterial({ color: 0x7a7570, roughness: 0.9, flatShading: true }));
rock.position.copy(ROCK); rock.castShadow = true; scene.add(rock);
const SPOT = new THREE.Vector3(0, 0, 0);
const mage = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.9, 4, 8), new THREE.MeshStandardMaterial({ color: 0x4a4a66, roughness: 0.8 }));
mage.position.set(SPOT.x + 2.4, 0.67, SPOT.z + 2.6); mage.castShadow = true; scene.add(mage);
const MAGE = mage.position.clone();

const fx = createFx(scene, { quality });

/* ---- post like the game */
// Low quality renders straight, like the game.
const composer = quality === 'low' ? null : new EffectComposer(renderer);
if (composer) {
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.38, 0.55, 0.88));
  composer.addPass(new OutputPass());
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer?.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  fx.setViewHeight(h * renderer.getPixelRatio());
}
addEventListener('resize', resize); resize();

/* ---- cameras: the game's (about 10 m up, 12 m back) and a close-up */
const targetFor = (name) => (name === 'burn' ? new THREE.Vector3(TREE.x, 1.4, TREE.z) : name === 'motes' ? new THREE.Vector3(1.2, 0.8, 0.6) : new THREE.Vector3(SPOT.x, 0.6, SPOT.z));
function setCam(kind, name = which) {
  const t = targetFor(name);
  if (kind === 'game') { camera.position.set(t.x - 12, 9.8, t.z + 0.01); controls.target.set(t.x + 0.6, 0.2, t.z); }
  else { camera.position.set(t.x - 4.2, t.y + 1.6, t.z + 3.4); controls.target.copy(t); }
  controls.update();
}
setCam(Q.get('cam') || 'close');

/* ---- the effects, each at the spot */
let n = 0;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const FIRE = {
  burn() { fx.burn('tree', TREE.x, 0, TREE.z, 0.5, 3.2, { rate: 1 }); fx.burn('crown', TREE.x, 2.1, TREE.z, 0.9, 1.6, { rate: 0.7 }); },
  explosion() { fx.explosion(SPOT.x, 0, SPOT.z, { r: 1.2 }); },
  lightning() { fx.lightning(V(SPOT.x + 0.3, 5.5, SPOT.z - 0.3), V(SPOT.x, 0, SPOT.z)); },
  sigil() { fx.sigil(SPOT.x, 0, SPOT.z, [0x52b6ff, 0xe0a46a, 0xc98bff][n % 3], { dur: 1.4, r: 1.1 }); },
  bolt() {
    const from = V(MAGE.x, 1.1, MAGE.z), to = V(SPOT.x, 0.6, SPOT.z);
    if (n % 2 === 0) fx.bolt(from, to, { colour: 0xff9a3a, dur: 0.55, size: 0.22, trail: 'fire', onArrive: () => fx.explosion(SPOT.x, 0, SPOT.z, { r: 0.8 }) });
    else fx.bolt(from, to, { colour: 0x9fd8ff, dur: 0.55, size: 0.2, trail: 'soft', onArrive: () => { fx.flash(to.x, to.y, to.z, 0x9fd8ff, 10, 0.3, 5); fx.ring(to.x, 0, to.z, 1.2, 0x9fd8ff, { dur: 0.4 }); fx.burst(to.x, to.y, to.z, 0x9fd8ff, { n: 24 }); } });
  },
  dust() { fx.dust(SPOT.x, 0, SPOT.z, { n: 30, size: 0.7 }); },
  debris() { fx.debris(SPOT.x, 0.2, SPOT.z, { n: 12, colour: [0x6b6358, 0x2a1d12, 0x7fdcff][n % 3], size: 0.18, spread: 0.5, up: 4 }); },
  motes() {
    fx.motes(SPOT.x, 0, SPOT.z, 0x6cf09a, { n: 28 });
    fx.motes(SPOT.x + 2.2, 0, SPOT.z, 0x86e03a, { n: 18, up: 0.6, size: 0.18, drip: true });
    fx.motes(MAGE.x, 0, MAGE.z, 0xffcf5a, { n: 50, up: 2.5, r: 0.6, life: 1.6, size: 0.18 });
    fx.levitating('rock', ROCK.x, ROCK.y - 0.5, ROCK.z, 0.55);
  },
  ring() { fx.ring(SPOT.x, 0, SPOT.z, 2.2, 0xd9c9a8, { dur: 0.5, width: 0.15 }); fx.ring(SPOT.x, 0, SPOT.z, 1.5, 0xfff0d0, { dur: 0.8, width: 0.5, opacity: 0.4 }); },
  quake() { fx.quake(SPOT.x, 0, SPOT.z, { r: 3 }); },
  beam() { fx.beam(V(MAGE.x, 1.0, MAGE.z), V(SPOT.x - 1.5, 1.0, SPOT.z + 1.5), 0x9fd8ff, { dur: 1.2 }); },
  burst() { fx.burst(SPOT.x, 1.0, SPOT.z, [0xffcf5a, 0x6cf09a, 0x9fd8ff][n % 3], { n: 40 }); },
};
let lastFire = 0;
function fire(name = which) { FIRE[name]?.(); n++; lastFire = performance.now(); document.querySelector('#name').textContent = name; }
rock.visible = which === 'motes';
fire(which);
let timer = period > 0 ? setInterval(() => fire(which), period) : null;

const bar = document.querySelector('#bar');
for (const nm of NAMES) { const a = document.createElement('a'); a.href = `?fx=${nm}&cam=${Q.get('cam') || 'close'}`; a.textContent = nm; if (nm === which) a.className = 'on'; bar.appendChild(a); }

let last = performance.now(), frames = 0, fpsT = 0;
const shakeV = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fx.update(dt, now);
  if (which === 'motes') { rock.position.y = ROCK.y + Math.sin(now / 700) * 0.15; rock.rotation.y += dt * 0.3; fx.moveEmitter('rock', ROCK.x, rock.position.y - 0.5, ROCK.z); }
  controls.update();
  fx.shakeOffset(shakeV);
  camera.position.add(shakeV);
  if (composer) composer.render(); else renderer.render(scene, camera);
  camera.position.sub(shakeV);
  frames++; fpsT += dt;
  if (fpsT > 0.5) { const live = Object.values(fx.pools).reduce((s, p) => s + p.n, 0); document.querySelector('#info').textContent = `${Math.round(frames / fpsT)} fps  ${live} particles`; frames = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.LAB = { fx, scene, camera, renderer, fire, setCam, names: NAMES, get lastFire() { return lastFire; }, stopLoop() { if (timer) clearInterval(timer); timer = null; }, ready: true };
</script>
</body>
</html>

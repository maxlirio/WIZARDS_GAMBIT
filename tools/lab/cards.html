<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cards lab</title>
<!-- A few spell cards at arm's length, exactly as cards.js draws them, so the
     centre layout can be judged at hover size. ?ids=EMBER_LASH:0,CHANGE:1 picks
     cards and rotations; ?size=560 sets the width. window.LAB.ready when drawn. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>body{margin:0;background:#1a1612;display:flex;flex-wrap:wrap;gap:16px;padding:16px}.c{display:block}</style>
</head>
<body>
<script type="module">
import { cardSVG } from '../../js/view/cards.js';
import { CARDS } from '../../js/rules/spells/index.js';
const q = new URLSearchParams(location.search);
const size = +(q.get('size') || 560);
const ids = (q.get('ids') || 'EMBER_LASH:0,CHANGE:0,FUSE:3,TALLY:0').split(',');
await document.fonts.ready;
for (const spec of ids) {
  const [id, r] = spec.split(':');
  const def = CARDS[id]; if (!def) continue;
  const d = document.createElement('div'); d.className = 'c'; d.style.width = `${size}px`; d.style.height = `${size}px`;
  d.innerHTML = cardSVG(def, { rot: +(r || 0) });
  const svg = d.querySelector('svg'); if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); }
  document.body.appendChild(d);
}
window.LAB = { ready: true };
</script>
</body>
</html>
